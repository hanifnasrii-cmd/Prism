name: Build Prism APK

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Android SDK 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-dist
          find app/build/outputs/apk/release/ -type f -name "*.apk" -ls
          apk_path=$(find app/build/outputs/apk/release/ -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$apk_path" ]; then
            apk_path=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          fi
          test -n "$apk_path"
          cp "$apk_path" apk-dist/Prism-v1.8.6-Optimized.apk
          ls -lh apk-dist/Prism-v1.8.6-Optimized.apk

      - name: Upload Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Optimized-APK
          path: apk-dist/Prism-v1.8.6-Optimized.apk

  test:
    name: Run Full Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Android SDK 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --continue --stacktrace

      - name: Summarize Unit Test Results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          total = fail = err = skip = 0
          failed = []
          for f in files:
              root = ET.parse(f).getroot()
              suite = root.attrib.get('name', f)
              t = int(root.attrib.get('tests', 0))
              fa = int(root.attrib.get('failures', 0))
              er = int(root.attrib.get('errors', 0))
              sk = int(root.attrib.get('skipped', 0))
              total += t; fail += fa; err += er; skip += sk
              print(f"{suite}: tests={t}, failures={fa}, errors={er}, skipped={sk}, time={root.attrib.get('time', '?')}s")
              for tc in root.findall('testcase'):
                  for tag in ('failure', 'error'):
                      el = tc.find(tag)
                      if el is not None:
                          failed.append(f"{tc.attrib.get('classname', '')}.{tc.attrib.get('name', '')}: {el.attrib.get('message', '')}")
          print(f"\nTOTAL: tests={total}, failures={fail}, errors={err}, skipped={skip}")
          if failed:
              print("FAILED CASES:")
              for item in failed:
                  print(f"  - {item}")
          EOF

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
