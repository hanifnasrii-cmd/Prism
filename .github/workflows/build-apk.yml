name: Build Prism APK

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Optimized APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Android SDK 37
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Optimized Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p apk-dist
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} apk-dist/Prism-v1.8.6-Optimized.apk \;
          ls -lh apk-dist/

      - name: Upload Optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Optimized-APK
          path: apk-dist/Prism-v1.8.6-Optimized.apk
